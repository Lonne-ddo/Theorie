<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<title>MIND</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#080808;--s1:#0f0f0f;--s2:#161616;--bd:#1e1e1e;--txt:#e8e4e0;--muted:#3a3a3a;--m2:#666}
html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:'Syne',sans-serif;overflow:hidden}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;position:relative}

/* LOADING */
#loading{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;transition:opacity .6s}
#loading.out{opacity:0;pointer-events:none}
.spin{width:36px;height:36px;border:1.5px solid var(--bd);border-top-color:#e02020;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
#load-txt{font-family:'Space Mono',monospace;font-size:10px;color:var(--m2);letter-spacing:.12em;text-transform:uppercase}

/* HEADER */
#hdr{height:56px;display:flex;align-items:center;padding:0 18px;gap:12px;border-bottom:0.5px solid var(--bd);flex-shrink:0;position:relative;z-index:10}
#back-btn{width:32px;height:32px;border-radius:4px;border:0.5px solid var(--bd);background:transparent;color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:16px;transition:all .15s;flex-shrink:0}
#back-btn.vis{display:flex}
#back-btn:hover{border-color:#e02020;color:#e02020}
#app-name{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--txt);flex:1}
#app-name span{opacity:.3}
#hdr-section{font-size:10px;font-family:'Space Mono',monospace;color:var(--m2);letter-spacing:.08em;text-transform:uppercase;flex:1;text-align:center}
#hdr-actions{display:flex;align-items:center;gap:6px}
.hbtn{width:30px;height:30px;border-radius:3px;border:0.5px solid var(--bd);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;font-family:'Space Mono',monospace}
.hbtn:hover{border-color:#e02020;color:#e02020}
#sync-dot{width:5px;height:5px;border-radius:50%;background:var(--muted);transition:background .3s;flex-shrink:0}
#sync-dot.live{background:#22c55e;animation:pd 2s infinite}
#sync-dot.load{background:#e02020;animation:pd .8s infinite}
@keyframes pd{0%,100%{opacity:1}50%{opacity:.3}}

/* BREADCRUMB */
#bc{padding:8px 18px;display:flex;align-items:center;gap:5px;font-size:9px;font-family:'Space Mono',monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;min-height:28px}
.bc-i{cursor:pointer;transition:color .15s}
.bc-i:hover{color:#e02020}
.bc-i.cur{color:var(--m2);cursor:default}
.bc-sep{opacity:.3}

/* VIEWS */
#views{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;transition:opacity .25s,transform .25s;padding-bottom:80px}
.view.hidden{opacity:0;pointer-events:none;transform:translateX(20px)}

/* HOME */
#home-inner{padding:20px 16px}
#home-greeting{font-size:22px;font-weight:700;margin-bottom:4px}
#home-date{font-size:10px;font-family:'Space Mono',monospace;color:var(--m2);margin-bottom:24px;letter-spacing:.08em}
#sections-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-card{background:var(--s1);border:0.5px solid var(--bd);border-radius:10px;padding:16px 14px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.sec-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:10px 0 0 10px}
.sec-card:hover{background:var(--s2);transform:translateY(-1px)}
.sec-card:active{transform:scale(.97)}
.sec-icon{font-size:18px;margin-bottom:8px;display:block}
.sec-label{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--txt);margin-bottom:4px;line-height:1.2}
.sec-count{font-size:9px;font-family:'Space Mono',monospace;color:var(--muted);letter-spacing:.06em}
.sec-mod{font-size:8px;font-family:'Space Mono',monospace;color:var(--muted);margin-top:6px;opacity:.6}
.sec-card.conspiracy{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.sec-card.conspiracy::before{border-radius:10px 0 0 10px}
.sec-card.conspiracy .sec-icon{font-size:24px;margin:0}
.sec-card.conspiracy .sec-label{font-size:15px}
.conspiracy-arrow{margin-left:auto;font-size:18px;opacity:.4}

/* SECTION VIEW */
#sec-header{padding:20px 18px 12px;flex-shrink:0}
#sec-title{font-size:20px;font-weight:700;margin-bottom:2px}
#sec-sub{font-size:10px;font-family:'Space Mono',monospace;color:var(--m2);letter-spacing:.08em}
#docs-list{padding:0 16px}
.doc-card{background:var(--s1);border:0.5px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.doc-card:hover{background:var(--s2);border-color:var(--m2)}
.doc-card:active{transform:scale(.98)}
.doc-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--txt);margin-bottom:4px}
.doc-preview{font-size:11px;color:var(--m2);font-family:'Space Mono',monospace;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.doc-meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.doc-mod{font-size:8px;font-family:'Space Mono',monospace;color:var(--muted)}
.doc-arr{font-size:12px;color:var(--muted)}
.docs-empty{padding:40px 18px;text-align:center;font-size:11px;font-family:'Space Mono',monospace;color:var(--muted)}

/* DOC VIEW */
#doc-header{padding:20px 18px 12px}
#doc-title-el{font-size:18px;font-weight:700;margin-bottom:2px;line-height:1.2}
#doc-mod-el{font-size:9px;font-family:'Space Mono',monospace;color:var(--muted);margin-bottom:0}
#doc-cards-wrap{padding:0 16px}
.content-card{background:var(--s1);border:0.5px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:8px}
.content-card-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--txt);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.content-card-title::before{content:'';width:3px;height:13px;border-radius:2px;flex-shrink:0}
.content-bullet{display:flex;gap:8px;margin-bottom:5px;align-items:flex-start}
.content-bullet-dot{flex-shrink:0;font-size:10px;margin-top:2px}
.content-bullet-text{font-size:12px;color:#7a7672;font-family:'Space Mono',monospace;line-height:1.6}

/* MIND MAP VIEW */
#view-mindmap canvas{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.25}
#view-mindmap svg{position:absolute;inset:0;width:100%;height:100%}
#mm-controls{position:absolute;bottom:24px;left:18px;display:flex;flex-direction:column;gap:5px;z-index:10}
.mm-btn{width:30px;height:30px;border-radius:4px;background:var(--s1);border:0.5px solid var(--bd);color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mm-btn:hover{border-color:#e02020;color:#e02020}
#mm-panel{position:absolute;right:0;top:0;bottom:0;width:0;overflow:hidden;background:var(--s1);border-left:0.5px solid var(--bd);transition:width .3s;z-index:10}
#mm-panel.open{width:300px}
#mm-panel-inner{padding:20px 16px;height:100%;overflow-y:auto;display:flex;flex-direction:column}
#mm-panel-bar{height:2px;margin-bottom:16px;border-radius:1px}
#mm-panel-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:3px;color:var(--txt)}
#mm-panel-cat{font-size:9px;font-family:'Space Mono',monospace;margin-bottom:12px;text-transform:uppercase;letter-spacing:.1em}
#mm-panel-desc{font-size:12px;line-height:1.8;color:#585450;border-left:1.5px solid var(--bd);padding-left:12px;margin-bottom:12px}
#mm-panel-doc{display:none;margin-top:auto;padding:7px 12px;border-radius:3px;background:transparent;border:0.5px solid var(--bd);color:var(--m2);font-size:9px;font-family:'Space Mono',monospace;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:all .15s;text-align:center;text-decoration:none}
#mm-panel-doc:hover{border-color:#e02020;color:#e02020}
#mm-bc{position:absolute;top:8px;left:18px;z-index:10;font-size:9px;font-family:'Space Mono',monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:4px;max-width:50vw;flex-wrap:wrap}
.mm-bc-i{cursor:pointer;transition:color .15s}
.mm-bc-i:hover{color:#e02020}
.mm-bc-i.cur{color:var(--m2);cursor:default}
#mm-back{position:absolute;bottom:24px;left:18px;display:none;z-index:11}
#mm-back.vis{display:flex}
.mm-back-btn{height:30px;padding:0 10px;border-radius:4px;background:var(--s1);border:0.5px solid var(--bd);color:var(--muted);cursor:pointer;font-size:9px;display:flex;align-items:center;gap:5px;transition:all .15s;font-family:'Space Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.mm-back-btn:hover{border-color:#e02020;color:#e02020}
#mm-hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);font-family:'Space Mono',monospace;z-index:9;pointer-events:none;opacity:.3;white-space:nowrap}

/* NOTE BUTTON */
#note-fab{position:fixed;bottom:24px;right:18px;width:44px;height:44px;border-radius:50%;background:#e02020;border:none;color:#fff;cursor:pointer;font-size:20px;display:none;align-items:center;justify-content:center;z-index:50;box-shadow:0 0 16px rgba(224,32,32,.35);transition:all .2s}
#note-fab.vis{display:flex}
#note-fab:hover{transform:scale(1.1)}

/* NOTE MODAL */
#note-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
#note-overlay.open{display:flex}
#note-modal{background:var(--s1);border-radius:12px 12px 0 0;border:0.5px solid var(--bd);padding:20px 18px 32px;width:100%;max-width:600px;animation:slideup .2s ease}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#note-modal h3{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin-bottom:4px;color:var(--txt)}
#note-modal p{font-size:10px;color:var(--m2);font-family:'Space Mono',monospace;margin-bottom:14px}
#note-title{width:100%;padding:8px 10px;background:var(--s2);border:0.5px solid var(--bd);border-radius:3px;color:var(--txt);font-size:11px;font-family:'Space Mono',monospace;margin-bottom:8px;outline:none}
#note-title:focus{border-color:#e02020}
#note-content{width:100%;padding:8px 10px;background:var(--s2);border:0.5px solid var(--bd);border-radius:3px;color:var(--txt);font-size:11px;font-family:'Space Mono',monospace;min-height:80px;resize:vertical;outline:none;line-height:1.6}
#note-content:focus{border-color:#e02020}
.note-row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.n-btn{padding:7px 14px;border-radius:3px;font-size:9px;font-family:'Space Mono',monospace;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:all .15s}
.n-cancel{background:transparent;border:0.5px solid var(--bd);color:var(--m2)}
.n-cancel:hover{border-color:var(--m2);color:var(--txt)}
.n-save{background:#e02020;border:none;color:#fff}
.n-save:hover{background:#ff3333}
.n-save:disabled{opacity:.4;cursor:not-allowed}
#note-fb{font-size:9px;font-family:'Space Mono',monospace;margin-top:8px;text-align:right;min-height:12px}

/* SEARCH */
#srch-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:150;display:none;flex-direction:column;align-items:center;padding-top:60px;backdrop-filter:blur(6px)}
#srch-overlay.open{display:flex}
#srch-box{width:100%;max-width:520px;padding:0 18px;position:relative}
#srch-input{width:100%;padding:12px 40px 12px 16px;background:#111;border:0.5px solid var(--bd);border-radius:6px;color:var(--txt);font-size:14px;font-family:'Space Mono',monospace;outline:none;transition:border-color .15s}
#srch-input:focus{border-color:#e02020}
#srch-x{position:absolute;right:28px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer}
#srch-x:hover{color:#e02020}
#srch-cnt{font-size:9px;font-family:'Space Mono',monospace;color:var(--muted);padding:8px 4px 4px;max-width:520px;width:100%;padding-left:18px}
#srch-res{width:100%;max-width:520px;padding:0 18px;overflow-y:auto;max-height:calc(100vh - 180px)}
.sr-item{padding:12px 14px;background:var(--s1);border:0.5px solid var(--bd);border-radius:5px;margin-bottom:6px;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:10px}
.sr-item:hover{border-color:var(--m2);background:var(--s2)}
.sr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.sr-body{flex:1;min-width:0}
.sr-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--txt);margin-bottom:2px}
.sr-prev{font-size:10px;color:var(--m2);font-family:'Space Mono',monospace;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sr-path{font-size:8px;color:var(--muted);font-family:'Space Mono',monospace;margin-top:3px}
mark{background:rgba(224,32,32,.2);color:#e02020;border-radius:2px;padding:0 1px}
@media(max-width:640px){#sections-grid{grid-template-columns:1fr 1fr}#mm-panel.open{width:100vw;position:absolute}}

#view-youtube{padding:0}
#yt-inner{padding:16px;max-width:720px;margin:0 auto;padding-bottom:100px}
#yt-title-bar{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
#yt-title-bar::before{content:'';width:3px;height:12px;background:#ff4444;border-radius:2px;display:block}
#yt-url-row{display:flex;gap:8px;margin-bottom:8px}
#yt-url{flex:1;padding:10px 12px;background:var(--s1);border:0.5px solid var(--bd);border-radius:5px;color:var(--txt);font-size:12px;font-family:'Space Mono',monospace;outline:none;transition:border-color .15s}
#yt-url:focus{border-color:#ff4444}
#yt-lang{width:60px;padding:10px 8px;background:var(--s1);border:0.5px solid var(--bd);border-radius:5px;color:var(--txt);font-size:11px;font-family:'Space Mono',monospace;outline:none;cursor:pointer}
#yt-fetch-btn{padding:10px 16px;background:#ff4444;border:none;border-radius:5px;color:#fff;font-size:10px;font-family:'Space Mono',monospace;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:background .15s}
#yt-fetch-btn:hover{background:#ff2222}
#yt-fetch-btn:disabled{opacity:.4;cursor:not-allowed}
#yt-status{font-size:10px;font-family:'Space Mono',monospace;color:var(--m2);min-height:16px;margin-bottom:12px}
#yt-paste-area{margin-bottom:12px;display:none}
#yt-paste-area p{font-size:10px;color:var(--m2);font-family:'Space Mono',monospace;margin-bottom:6px}
#yt-paste{width:100%;min-height:100px;padding:10px 12px;background:var(--s1);border:0.5px solid var(--bd);border-radius:5px;color:var(--txt);font-size:11px;font-family:'Space Mono',monospace;resize:vertical;outline:none;line-height:1.6}
#yt-paste:focus{border-color:#ff4444}
.yt-section-label{font-size:9px;font-family:'Space Mono',monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.yt-section-label::after{content:'';flex:1;height:0.5px;background:var(--bd)}
#yt-transcript-box{background:var(--s1);border:0.5px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px;display:none}
#yt-transcript-toggle{width:100%;padding:10px 14px;background:transparent;border:none;color:var(--m2);font-size:10px;font-family:'Space Mono',monospace;cursor:pointer;text-align:left;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
#yt-transcript-text{padding:12px 14px;font-size:11px;color:#585450;font-family:'Space Mono',monospace;line-height:1.7;max-height:180px;overflow-y:auto;display:none;border-top:0.5px solid var(--bd)}
#yt-analyze-btn{width:100%;padding:11px;background:rgba(255,68,68,.1);border:0.5px solid #ff444440;border-radius:5px;color:#ff4444;font-size:10px;font-family:'Space Mono',monospace;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;transition:all .15s;margin-bottom:4px;display:none}
#yt-analyze-btn:hover{background:rgba(255,68,68,.18);border-color:#ff4444}
#yt-ideas{display:none}
.yt-idea-card{background:var(--s1);border:0.5px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:8px;animation:fade-in .3s ease}
@keyframes fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.yt-idea-tag{font-size:8px;font-family:'Space Mono',monospace;padding:2px 7px;border-radius:2px;text-transform:uppercase;letter-spacing:.08em;display:inline-block;margin-bottom:6px}
.yt-idea-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--txt);margin-bottom:6px}
.yt-idea-body{font-size:11px;color:#7a7672;font-family:'Space Mono',monospace;line-height:1.65}
#yt-chat-wrap{display:none;margin-top:4px}
#yt-messages{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;max-height:400px;overflow-y:auto}
.yt-msg{padding:10px 14px;border-radius:6px;font-size:12px;font-family:'Space Mono',monospace;line-height:1.6;animation:fade-in .2s ease}
.yt-msg.user{background:rgba(255,68,68,.08);border:0.5px solid rgba(255,68,68,.2);color:var(--txt);align-self:flex-end;max-width:85%}
.yt-msg.ai{background:var(--s1);border:0.5px solid var(--bd);color:#a0a0a0;align-self:flex-start;max-width:92%}
.yt-msg.ai.loading{color:var(--muted)}
#yt-chat-row{display:flex;gap:8px}
#yt-chat-input{flex:1;padding:10px 12px;background:var(--s1);border:0.5px solid var(--bd);border-radius:5px;color:var(--txt);font-size:12px;font-family:'Space Mono',monospace;outline:none;transition:border-color .15s}
#yt-chat-input:focus{border-color:#ff4444}
#yt-send-btn{padding:10px 14px;background:#ff4444;border:none;border-radius:5px;color:#fff;font-size:13px;cursor:pointer;transition:background .15s}
#yt-send-btn:hover{background:#ff2222}
#yt-send-btn:disabled{opacity:.4;cursor:not-allowed}
#yt-save-btn{display:none;width:100%;padding:10px;background:transparent;border:0.5px solid var(--bd);border-radius:5px;color:var(--m2);font-size:10px;font-family:'Space Mono',monospace;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;margin-top:16px;transition:all .15s}
#yt-save-btn:hover{border-color:#22c55e;color:#22c55e}
</style>
</head>
<body>
<div id="app">
  <div id="loading"><div class="spin"></div><div id="load-txt">Chargement de MIND...</div></div>
  <div id="hdr">
    <button id="back-btn" onclick="goBack()">&#8592;</button>
    <div id="app-name">MIND<span> //</span></div>
    <div id="hdr-section"></div>
    <div id="hdr-actions">
      <div id="sync-dot"></div>
      <button class="hbtn" id="refresh-btn" onclick="syncAll()" title="Sync">&#8635;</button>
      <button class="hbtn" onclick="openSearch()" title="Rechercher">&#9906;</button>
    </div>
  </div>
  <div id="bc"></div>
  <div id="views">
    <div class="view" id="view-home">
      <div id="home-inner">
        <div id="home-greeting">Bonsoir.</div>
        <div id="home-date"></div>
        <div id="sections-grid"></div>
      </div>
    </div>
    <div class="view hidden" id="view-section">
      <div id="sec-header">
        <div id="sec-title"></div>
        <div id="sec-sub"></div>
      </div>
      <div id="docs-list"></div>
    </div>
    <div class="view hidden" id="view-doc">
      <div id="doc-header">
        <div id="doc-title-el"></div>
        <div id="doc-mod-el"></div>
      </div>
      <div id="doc-cards-wrap"></div>
    </div>
    <div class="view hidden" id="view-youtube" style="overflow-y:auto">
      <div id="yt-inner">
        <div id="yt-title-bar">YouTube Lab — Transcription & Analyse IA</div>
        <div id="yt-url-row">
          <input id="yt-url" type="text" placeholder="https://youtube.com/watch?v=..."/>
          <select id="yt-lang"><option value="fr">FR</option><option value="en">EN</option></select>
          <button id="yt-fetch-btn" onclick="ytFetch()">Fetch</button>
        </div>
        <div id="yt-status"></div>
        <div id="yt-paste-area">
          <p>Colle la transcription manuellement :</p>
          <textarea id="yt-paste" placeholder="Colle ici le texte de la transcription YouTube..."></textarea>

      <button class="n-btn n-cancel" onclick="closeNote()">Annuler</button>
      <button class="n-btn n-save" id="note-save" onclick="saveNote()">Sauvegarder</button>
    </div>

<div id="srch-overlay" onclick="if(event.target===this)closeSearch()">
  <div id="srch-box">
    <input id="srch-input" type="text" placeholder="Rechercher dans toutes les sections..."/>
    <button id="srch-x" onclick="closeSearch()">&#215;</button>
  </div>
  <div id="srch-cnt"></div>
  <div id="srch-res"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
var GAS='https://script.google.com/macros/s/AKfycbzF3q2HqF49UdZaNvDWKoqtVErWkX7QQAxULw6ZETPWrX6Um9H9X9PjWxVkbkxZBL7M1w/exec';

/* ── STATE ── */
var appState='home';
var navStack=[];
var sections=[];
var curSection=null;
var curDoc=null;
var curDocId=null;
var noteDocId=null;
var searchCache={};

/* ── NAVIGATION ── */
function navigate(newState,data){
  navStack.push({state:appState,data:{section:curSection,doc:curDoc,docId:curDocId}});
  appState=newState;
  showView(newState,data);
  updateHeader();
  updateBC();
  document.getElementById('note-fab').classList.toggle('vis',newState==='doc');
}

function goBack(){
  if(!navStack.length) return;
  var prev=navStack.pop();
  appState=prev.state;
  curSection=prev.data.section;
  curDoc=prev.data.doc;
  curDocId=prev.data.docId;
  restoreView(prev.state);
  updateHeader();
  updateBC();
  document.getElementById('note-fab').classList.toggle('vis',prev.state==='doc');
}

function showView(state,data){
  document.querySelectorAll('.view').forEach(function(v){v.classList.add('hidden');});
  var el=document.getElementById('view-'+state);
  if(el) el.classList.remove('hidden');
  if(state==='home') renderHome();
  else if(state==='section') renderSection(data);
  else if(state==='doc') renderDoc(data);
  else if(state==='mindmap') initMindmap();
  else if(state==='youtube') initYoutubeLab();
}

function restoreView(state){
  document.querySelectorAll('.view').forEach(function(v){v.classList.add('hidden');});
  var el=document.getElementById('view-'+state);
  if(el) el.classList.remove('hidden');
  if(state==='home') renderHome();
}

function updateHeader(){
  var btn=document.getElementById('back-btn');
  var nm=document.getElementById('app-name');
  var sec=document.getElementById('hdr-section');
  btn.classList.toggle('vis',navStack.length>0&&appState!=='home');
  nm.style.display=appState==='home'?'block':'none';
  sec.textContent='';
  if(appState==='section'&&curSection) sec.textContent=curSection.label;
  if(appState==='doc'&&curDoc) sec.textContent=curDoc.title;
  if(appState==='mindmap') sec.textContent='CONSPIRATION';
}

function updateBC(){
  var bc=document.getElementById('bc');bc.innerHTML='';
  var items=[{label:'HOME',onclick:function(){while(navStack.length)navStack.pop();appState='home';showView('home');updateHeader();updateBC();document.getElementById('note-fab').classList.remove('vis');}}];
  if(appState==='section'&&curSection) items.push({label:curSection.label,onclick:null});
  if(appState==='doc'){
    if(curSection) items.push({label:curSection.label,onclick:function(){goBack();}});
    if(curDoc) items.push({label:curDoc.title.slice(0,20)+(curDoc.title.length>20?'..':''),onclick:null});
  }
  items.forEach(function(item,i){
    if(i>0){var sep=document.createElement('span');sep.className='bc-sep';sep.textContent='›';bc.appendChild(sep);}
    var el=document.createElement('span');
    el.className='bc-i'+(i===items.length-1?' cur':'');
    el.textContent=item.label;
    if(item.onclick) el.onclick=item.onclick;
    bc.appendChild(el);
  });
}

/* ── HOME ── */
function renderHome(){
  document.getElementById('home-greeting').style.display='none';
  document.getElementById('home-date').style.display='none';
  var grid=document.getElementById('sections-grid');grid.innerHTML='';
  sections.forEach(function(s){
    var card=document.createElement('div');
    card.className='sec-card'+(s.id==='conspiracy'?' conspiracy':'');
    card.style.setProperty('--c',s.color);
    card.style.cssText+='border-color:'+s.color+'22;';
    card.innerHTML='<style>.sec-card[data-id="'+s.id+'"]:before{background:'+s.color+'}</style>';
    card.setAttribute('data-id',s.id);
    var mod=s.lastModified?new Date(s.lastModified).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';
    if(s.id==='conspiracy'){
      card.innerHTML+='<span class="sec-icon">'+s.icon+'</span><div><div class="sec-label" style="color:'+s.color+'">'+s.label+'</div><div class="sec-count">'+s.docCount+' documents</div></div><div class="conspiracy-arrow">&#8594;</div>';
    } else {
      card.innerHTML+='<span class="sec-icon" style="color:'+s.color+'">'+s.icon+'</span><div class="sec-label">'+s.label+'</div><div class="sec-count">'+s.docCount+' doc'+(s.docCount>1?'s':'')+'</div>'+(mod?'<div class="sec-mod">'+mod+'</div>':'');
    }
    card.onclick=function(){clickSection(s);};
    grid.appendChild(card);
  });
}

function clickSection(s){
  if(s.id==='conspiracy'){ curSection=s; navigate('mindmap',null); return; }
  if(s.id==='youtube'){ curSection=s; navigate('youtube',null); return; }
  curSection=s;
  navigate('section',null);
  loadSection(s.id);
}

/* ── SECTION ── */
function renderSection(data){
  var el=document.getElementById('sec-title');
  var sub=document.getElementById('sec-sub');
  if(curSection){el.textContent=curSection.label;el.style.color=curSection.color;}
  sub.textContent='SECTION';
  document.getElementById('docs-list').innerHTML='<div class="docs-empty">Chargement...</div>';
}

function loadSection(id){
  fetch(GAS+'?action=section&id='+id,{redirect:'follow'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(data){
      if(data.error){
        document.getElementById('docs-list').innerHTML='<div class="docs-empty">GAS : '+esc(data.error)+'</div>';
        return;
      }
      if(curSection) curSection=Object.assign(curSection,data);
      searchCache[id]=data;
      renderDocs(data.docs||[]);
    })
    .catch(function(err){
      document.getElementById('docs-list').innerHTML='<div class="docs-empty" style="font-size:10px;line-height:1.8">Erreur : '+esc(err.message||'?')+'<br><br>Vérifie que le GAS est bien déployé<br>et accessible publiquement.</div>';
    });
}

function renderDocs(docs){
  var dl=document.getElementById('docs-list');dl.innerHTML='';
  var color=(curSection&&curSection.color)||'#e02020';
  if(!docs.length){dl.innerHTML='<div class="docs-empty">Aucun document dans ce dossier.</div>';return;}
  docs.forEach(function(doc){
    var card=document.createElement('div');card.className='doc-card';
    card.style.borderLeftColor=color;card.style.borderLeftWidth='2px';
    var mod=doc.lastModified?new Date(doc.lastModified).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'';
    card.innerHTML='<div class="doc-title">'+esc(doc.title)+'</div>'
      +(doc.preview?'<div class="doc-preview">'+esc(doc.preview)+'</div>':'')
      +'<div class="doc-meta"><span class="doc-mod">'+mod+'</span><span class="doc-arr">&#8594;</span></div>';
    card.onclick=function(){clickDoc(doc);};
    dl.appendChild(card);
  });
}

/* ── DOC ── */
function clickDoc(doc){
  curDoc=doc;curDocId=doc.id;
  noteDocId=doc.id;
  navigate('doc',null);
  document.getElementById('doc-title-el').textContent=doc.title;
  document.getElementById('doc-title-el').style.color=(curSection&&curSection.color)||'#e02020';
  document.getElementById('doc-mod-el').textContent='';
  document.getElementById('doc-cards-wrap').innerHTML='<div class="docs-empty">Chargement...</div>';
  fetch(GAS+'?action=doc&id='+doc.id,{redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.error){document.getElementById('doc-cards-wrap').innerHTML='<div class="docs-empty">'+data.error+'</div>';return;}
      curDoc=data;
      var mod=data.lastModified?new Date(data.lastModified).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
      document.getElementById('doc-mod-el').textContent=mod?'Modifié le '+mod:'';
      renderDocContent(data);
    })
    .catch(function(){document.getElementById('doc-cards-wrap').innerHTML='<div class="docs-empty">Impossible de charger.</div>';});
}

function renderDocContent(data){
  var wrap=document.getElementById('doc-cards-wrap');wrap.innerHTML='';
  var color=(curSection&&curSection.color)||'#e02020';
  var secs=data.sections||[];
  if(!secs.length){wrap.innerHTML='<div class="docs-empty">Document vide ou non structuré.</div>';return;}
  secs.forEach(function(s){
    var card=document.createElement('div');card.className='content-card';
    var html='';
    if(s.title){
      html+='<div class="content-card-title"><style>.content-card-title::before{background:'+color+'}</style>'+esc(s.title)+'</div>';
    }
    (s.bullets||[]).forEach(function(b){
      html+='<div class="content-bullet"><span class="content-bullet-dot" style="color:'+color+'">•</span><span class="content-bullet-text">'+esc(b)+'</span></div>';
    });
    card.innerHTML=html;
    wrap.appendChild(card);
  });
}

/* ── NOTES ── */
function openNote(){
  var lbl=document.getElementById('note-target-lbl');
  if(curDoc) lbl.textContent='→ '+curDoc.title;
  document.getElementById('note-overlay').classList.add('open');
  setTimeout(function(){document.getElementById('note-content').focus();},80);
}
function closeNote(){
  document.getElementById('note-overlay').classList.remove('open');
  document.getElementById('note-title').value='';
  document.getElementById('note-content').value='';
  document.getElementById('note-fb').textContent='';
  document.getElementById('note-save').disabled=false;
  document.getElementById('note-save').textContent='Sauvegarder';
}
function saveNote(){
  var content=document.getElementById('note-content').value.trim();
  var title=document.getElementById('note-title').value.trim();
  var fb=document.getElementById('note-fb');
  var btn=document.getElementById('note-save');
  if(!content||!noteDocId){fb.style.color='#e02020';fb.textContent='Contenu requis.';return;}
  btn.disabled=true;btn.textContent='...';
  fb.style.color='#666';fb.textContent='Envoi en cours...';
  var xhr=new XMLHttpRequest();
  xhr.open('POST',GAS,true);
  xhr.setRequestHeader('Content-Type','text/plain;charset=utf-8');
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText);
      if(d.success){fb.style.color='#22c55e';fb.textContent='✓ Note sauvegardée';setTimeout(closeNote,1400);}
      else{fb.style.color='#e02020';fb.textContent='Erreur : '+(d.error||'?');btn.disabled=false;btn.textContent='Sauvegarder';}
    }catch(e){fb.style.color='#22c55e';fb.textContent='✓ Note sauvegardée';setTimeout(closeNote,1400);}
  };
  xhr.onerror=function(){fb.style.color='#22c55e';fb.textContent='✓ Note sauvegardée';setTimeout(closeNote,1400);};
  xhr.send(JSON.stringify({docId:noteDocId,content:content,title:title}));
}

/* ── SEARCH ── */
function openSearch(){document.getElementById('srch-overlay').classList.add('open');setTimeout(function(){document.getElementById('srch-input').focus();},80);}
function closeSearch(){document.getElementById('srch-overlay').classList.remove('open');document.getElementById('srch-input').value='';document.getElementById('srch-res').innerHTML='';document.getElementById('srch-cnt').textContent='';}

function doSearch(q){
  var res=document.getElementById('srch-res');
  var cnt=document.getElementById('srch-cnt');
  q=q.trim();if(!q){res.innerHTML='';cnt.textContent='';return;}
  var lq=q.toLowerCase();
  var matches=[];
  Object.keys(searchCache).forEach(function(sId){
    var sd=searchCache[sId];
    var s=sections.find(function(x){return x.id===sId;})||{};
    (sd.docs||[]).forEach(function(doc){
      var score=0;
      if(doc.title.toLowerCase().indexOf(lq)>=0) score+=3;
      if((doc.preview||'').toLowerCase().indexOf(lq)>=0) score+=1;
      if(score>0) matches.push({doc:doc,section:s,score:score});
    });
  });
  matches.sort(function(a,b){return b.score-a.score;});
  cnt.textContent=matches.length+' résultat'+(matches.length>1?'s':'');
  if(!matches.length){res.innerHTML='<div style="text-align:center;padding:30px 0;font-family:Space Mono,monospace;font-size:10px;color:var(--muted)">Aucun résultat pour "'+esc(q)+'"</div>';return;}
  function hl(t){return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}
  res.innerHTML=matches.slice(0,15).map(function(m){
    var color=m.section.color||'#e02020';
    return '<div class="sr-item" onclick="srGoTo(\''+m.doc.id+'\',\''+m.section.id+'\')">'
      +'<div class="sr-dot" style="background:'+color+'"></div>'
      +'<div class="sr-body"><div class="sr-title">'+hl(esc(m.doc.title))+'</div>'
      +(m.doc.preview?'<div class="sr-prev">'+hl(esc(m.doc.preview.slice(0,100)))+'</div>':'')
      +'<div class="sr-path">'+esc(m.section.label||'')+'</div></div></div>';
  }).join('');
}

function srGoTo(docId,sectionId){
  closeSearch();
  var s=sections.find(function(x){return x.id===sectionId;});
  if(!s) return;
  curSection=s;
  while(navStack.length) navStack.pop();
  appState='home';
  navStack.push({state:'home',data:{}});
  appState='section';
  navStack.push({state:'section',data:{section:s}});
  showView('section',null);
  updateHeader();updateBC();
  document.getElementById('docs-list').innerHTML='<div class="docs-empty">Chargement...</div>';
  fetch(GAS+'?action=section&id='+sectionId,{redirect:'follow'})
    .then(function(r){return r.json();})
    .then(function(data){
      curSection=Object.assign(s,data);
      renderDocs(data.docs||[]);
      var doc=(data.docs||[]).find(function(d){return d.id===docId;});
      if(doc) setTimeout(function(){clickDoc(doc);},400);
    });
}

/* ── MIND MAP (CONSPIRACY) ── */

var mmGRoot,mmSim,mmZoom,mmW=0,mmH=0,mmPosCache={};

function mmNodeR(n){if(!n) return 20;if(n._role==='center') return 56;if(n._role==='child') return mmHasKids(n.id)?36:26;return 20;}
function mmHasKids(id){return !!(mmCHILDREN[id]&&mmCHILDREN[id].length);}
function mmGetDesc(n){return n.desc_en||n.desc||'';}

  };
  mmCHILDREN={center:['power','actors','means','methods','symbols'],means:['cognitive','human','lockdown','occult'],power:[],actors:[],cognitive:[],human:[],lockdown:[],occult:[],methods:[],symbols:[]};

          var key='con_'+doc.id.slice(-6);
          mmND[key]={id:key,label:doc.title.slice(0,20).toUpperCase().replace(' ','\n'),type:'leaf',color:'#e02020',docId:doc.id,desc_en:doc.preview||''};
          if(!mmCHILDREN['symbols']) mmCHILDREN['symbols']=[];

function initD3(){
  var el=document.getElementById('view-mindmap');
  mmW=el.offsetWidth||window.innerWidth;
  mmH=el.offsetHeight||(window.innerHeight-84);
  var svgEl=d3.select('#svg');
  svgEl.selectAll('*').remove();
  mmGRoot=svgEl.append('g').attr('transform','translate('+mmW/2+','+mmH/2+')');
  mmZoom=d3.zoom().scaleExtent([.1,8]).on('zoom',function(e){mmGRoot.attr('transform',e.transform);});
  svgEl.call(mmZoom).on('dblclick.zoom',null);
  svgEl.call(mmZoom.transform,d3.zoomIdentity.translate(mmW/2,mmH/2));
  svgEl.on('click',function(){closeMmPanel();});
  mmSim=d3.forceSimulation()
    .force('link',d3.forceLink().id(function(n){return n.id;}).distance(190).strength(.9))
    .force('charge',d3.forceManyBody().strength(-700))
    .force('center',d3.forceCenter(0,0))
    .force('collide',d3.forceCollide().radius(function(n){return mmNodeR(n)+12;}).strength(.9))
    .on('tick',mmTick);
  mmRefresh(true);
  mmUpdateBc();mmUpdateBack();
}

function mmBuildData(){
  var cnode=Object.assign({},mmND[mmCurrentId],{_role:'center'});
  var sv=mmPosCache[mmCurrentId+'__'+mmCurrentId];
  if(sv){cnode.x=sv.x;cnode.y=sv.y;}else{cnode.x=0;cnode.y=0;}
  var kids=mmCHILDREN[mmCurrentId]||[];
  var nodes=[cnode];var links=[];
  var a=(2*Math.PI)/Math.max(kids.length,1);
  kids.forEach(function(cid,i){
    var n=mmND[cid];if(!n) return;
    n=Object.assign({},n,{_role:'child',_par:mmCurrentId});
    var sv2=mmPosCache[mmCurrentId+'__'+cid];
    if(sv2){n.x=sv2.x;n.y=sv2.y;}
    else{n.x=Math.cos(i*a-Math.PI/2)*190;n.y=Math.sin(i*a-Math.PI/2)*190;}
    nodes.push(n);links.push({source:mmCurrentId,target:cid,ltype:'main'});
  });
  return{nodes:nodes,links:links};
}

function mmRefresh(anim){
  var d=mmBuildData();
  var lSel=mmGRoot.selectAll('line.link').data(d.links,function(l){return (l.source.id||l.source)+'-'+(l.target.id||l.target);});
  lSel.enter().append('line').attr('class','link')
    .attr('stroke',function(l){var n=mmND[l.target.id||l.target];return n?n.color+'50':'#e0202030';})
    .attr('stroke-width',1).attr('stroke-opacity',0)
    .transition().duration(350).attr('stroke-opacity',1);
  lSel.exit().transition().duration(200).attr('stroke-opacity',0).remove();

  var nSel=mmGRoot.selectAll('g.mmnode').data(d.nodes,function(n){return n.id;});
  nSel.exit().transition().duration(300).attr('opacity',0).remove();
  var enter=nSel.enter().append('g').attr('class','mmnode').attr('opacity',0).style('cursor','pointer')
    .call(d3.drag()
      .on('start',function(e,n){if(!e.active)mmSim.alphaTarget(.3).restart();n.fx=n.x;n.fy=n.y;})
      .on('drag', function(e,n){n.fx=e.x;n.fy=e.y;})
      .on('end',  function(e,n){if(!e.active)mmSim.alphaTarget(0);n.fx=null;n.fy=null;}))
    .on('click',function(e,n){e.stopPropagation();mmClick(n);})
    .on('mouseover',function(e,n){mmTip(e,n,true);})
    .on('mouseout', function(){mmTip(null,null,false);});

  enter.append('circle').attr('r',0).attr('fill','#030303')
    .attr('stroke',function(n){return n.color||'#e02020';})
    .attr('stroke-width',function(n){return n._role==='center'?2:n._role==='child'?1.2:.7;})
    .attr('stroke-opacity',function(n){return n.type==='leaf'?.45:.85;})
    .attr('stroke-dasharray',function(n){return n.type==='leaf'?'3,3':'none';})
    .transition().duration(anim?550:200).ease(d3.easeBackOut.overshoot(1.2)).attr('r',mmNodeR);

  enter.append('circle').attr('r',0).attr('fill',function(n){return (n.color||'#e02020')+'12';}).attr('stroke','none')
    .transition().duration(anim?550:200).ease(d3.easeBackOut.overshoot(1.2))
    .attr('r',function(n){return mmNodeR(n)-3;});

  enter.filter(function(n){return n._role==='center';}).append('circle')
    .attr('r',mmNodeR).attr('fill','none').attr('stroke',function(n){return n.color||'#e02020';})
    .attr('stroke-width',1).attr('stroke-opacity',.15).attr('pointer-events','none')
    .each(function(n){
      var r=d3.select(this);var base=mmNodeR(n);
      (function p(){r.attr('r',base).attr('stroke-opacity',.15).transition().duration(2200).ease(d3.easeLinear).attr('r',base+28).attr('stroke-opacity',0).on('end',p);})();
    });

  enter.filter(function(n){return n._role==='child'&&mmHasKids(n.id);})
    .append('text').attr('text-anchor','middle').attr('dominant-baseline','middle')
    .attr('y',function(n){return mmNodeR(n)+11;}).attr('font-size',7)
    .attr('font-family','Space Mono,monospace').attr('fill',function(n){return n.color||'#e02020';})
    .attr('opacity',.7).attr('pointer-events','none').text('▼');

  enter.each(function(n){
    var g=d3.select(this);
    var lines=(n.label||'').split('\n');
    var fs=n._role==='center'?11:n._role==='child'?10:8;var lh=11;
    var col=n._role==='center'?'#e02020':n.type==='leaf'?'#666':'#c0bcb8';
    var totalH=(lines.length-1)*lh;
    lines.forEach(function(line,i){
      g.append('text').attr('text-anchor','middle').attr('dominant-baseline','middle')
        .attr('y',-totalH/2+i*lh).attr('font-size',fs)
        .attr('font-family','Space Mono,monospace').attr('font-weight','700')
        .attr('fill',col).attr('pointer-events','none').attr('opacity',0)
        .text(line).transition().delay(anim?200:50).duration(280).attr('opacity',1);
    });
  });
  enter.transition().duration(anim?400:150).attr('opacity',1);
  enter.merge(nSel);

  mmSim.nodes(d.nodes);mmSim.force('link').links(d.links);mmSim.alpha(.6).restart();
}

function mmTick(){
  mmGRoot.selectAll('line.link').each(function(l){
    var sx=l.source.x||0,sy=l.source.y||0,tx=l.target.x||0,ty=l.target.y||0;
    var dx=tx-sx,dy=ty-sy,dist=Math.sqrt(dx*dx+dy*dy)||1;
    var sn=mmND[l.source.id||l.source],tn=mmND[l.target.id||l.target];
    var sr=(sn?mmNodeR(Object.assign({},sn,{_role:'child'})):20)+2;
    var tr=(tn?mmNodeR(Object.assign({},tn,{_role:'child'})):20)+2;
    d3.select(this).attr('x1',sx+(dx/dist)*sr).attr('y1',sy+(dy/dist)*sr)
      .attr('x2',tx-(dx/dist)*tr).attr('y2',ty-(dy/dist)*tr);
  });
  mmGRoot.selectAll('g.mmnode').attr('transform',function(n){
    mmPosCache[mmCurrentId+'__'+n.id]={x:n.x,y:n.y};
    return 'translate('+(n.x||0)+','+(n.y||0)+')';
  });
}

function mmClick(n){
  if(mmHasKids(n.id)){mmViewStack.push({id:mmCurrentId,label:(mmND[mmCurrentId].label||'').replace('\n',' ')});mmCurrentId=n.id;mmRefresh(true);mmUpdateBc();mmUpdateBack();closeMmPanel();}
  else openMmPanel(n);
}

function mmDrillUp(){
  if(!mmViewStack.length) return;
  var prev=mmViewStack.pop();mmCurrentId=prev.id;mmRefresh(false);mmUpdateBc();mmUpdateBack();closeMmPanel();
}

function mmUpdateBc(){
  var bc=document.getElementById('mm-bc');bc.innerHTML='';
  var items=[{id:'center',label:'NWO'}];
  mmViewStack.forEach(function(v){if(v.id!=='center')items.push({id:v.id,label:(mmND[v.id]&&mmND[v.id].label||v.id).replace('\n',' ')});});
  if(mmCurrentId!=='center') items.push({id:mmCurrentId,label:(mmND[mmCurrentId]&&mmND[mmCurrentId].label||mmCurrentId).replace('\n',' ')});
  items.forEach(function(item,i){
    if(i>0){var sep=document.createElement('span');sep.className='bc-sep';sep.textContent='›';bc.appendChild(sep);}
    var el=document.createElement('span');el.className='mm-bc-i'+(i===items.length-1?' cur':'');
    el.textContent=item.label.slice(0,16);
    if(i<items.length-1)(function(id){el.onclick=function(){while(mmViewStack.length&&mmViewStack[mmViewStack.length-1].id!==id)mmViewStack.pop();if(mmViewStack.length)mmViewStack.pop();mmCurrentId=id;mmRefresh(false);mmUpdateBc();mmUpdateBack();};})(item.id);
    bc.appendChild(el);
  });
}

function mmUpdateBack(){
  var btn=document.getElementById('mm-back');var lbl=document.getElementById('mm-back-lbl');
  if(mmViewStack.length>0){
    btn.classList.add('vis');
    var prev=mmViewStack[mmViewStack.length-1];
    var txt=(mmND[prev.id]&&mmND[prev.id].label||prev.id).replace('\n',' ');
    lbl.textContent=txt.slice(0,12)+(txt.length>12?'..':'');
  } else btn.classList.remove('vis');
}

function openMmPanel(n){
  var color=n.color||'#e02020';
  document.getElementById('mm-panel-bar').style.background=color;
  document.getElementById('mm-panel-title').textContent=(n.label||'').replace('\n',' ');
  document.getElementById('mm-panel-cat').textContent=n.type==='leaf'?'ARGUMENT':'CATEGORIE';
  document.getElementById('mm-panel-cat').style.color=color;
  document.getElementById('mm-panel-desc').textContent=mmGetDesc(n);
  var dl=document.getElementById('mm-panel-doc');
  if(n.docId){dl.href='https://docs.google.com/document/d/'+n.docId+'/edit';dl.style.display='block';}
  else dl.style.display='none';
  document.getElementById('mm-panel').classList.add('open');
}
function closeMmPanel(){document.getElementById('mm-panel').classList.remove('open');}
function mmZoom(k){d3.select('#svg').transition().duration(280).call(mmZoom.scaleBy,k);}
function mmReset(){d3.select('#svg').transition().duration(500).ease(d3.easeCubicInOut).call(mmZoom.transform,d3.zoomIdentity.translate(mmW/2,mmH/2));}

function initMmBg(){
  var c=document.getElementById('bg-canvas');
  c.width=mmW;c.height=mmH;
  var ctx=c.getContext('2d');
  var pts=[];for(var i=0;i<50;i++) pts.push({x:Math.random()*mmW,y:Math.random()*mmH,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.2+.4});
  function draw(){
    ctx.clearRect(0,0,mmW,mmH);
    pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>mmW)p.vx*=-1;if(p.y<0||p.y>mmH)p.vy*=-1;});
    for(var i=0;i<pts.length;i++){for(var j=i+1;j<pts.length;j++){var dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<130){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle='rgba(224,32,32,'+(0.1*(1-d/130))+')';ctx.lineWidth=.5;ctx.stroke();}}}
    pts.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(224,32,32,0.4)';ctx.fill();});
    window._mmRaf=requestAnimationFrame(draw);
  }
  if(window._mmRaf)cancelAnimationFrame(window._mmRaf);
  draw();
}

  var btn=document.getElementById('refresh-btn');
  var dot=document.getElementById('sync-dot');

        dot.className='sync-dot live';
      } else dot.className='sync-dot';
    })
    .catch(function(){btn.style.animation='';dot.className='sync-dot';});
}

/* ── UTILS ── */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(){var d=new Date();var h=d.getHours();return h<12?'Bonjour.':h<18?'Bon après-midi.':'Bonsoir.';}

/* ── YOUTUBE LAB ── */
var ytTranscript='';
var ytChatHistory=[];
var ytVideoId='';

function initYoutubeLab(){
  document.getElementById('yt-url').value='';
  document.getElementById('yt-status').textContent='';
}

function ytExtractId(url){
  var m=url.match(/[?&]v=([^&]+)/)||url.match(/youtu\.be\/([^?&]+)/)||url.match(/shorts\/([^?&]+)/);
  return m?m[1]:null;
}

function ytFetch(){
  var url=document.getElementById('yt-url').value.trim();
  var lang=document.getElementById('yt-lang').value;
  var id=ytExtractId(url);
  if(!id){document.getElementById('yt-status').textContent='URL invalide.';return;}
  ytVideoId=id;
  var btn=document.getElementById('yt-fetch-btn');
  btn.disabled=true;btn.textContent='...';
  document.getElementById('yt-status').textContent='Récupération de la transcription...';
  document.getElementById('yt-paste-area').style.display='none';
  fetch('/transcript?v='+id+'&lang='+lang)
    .then(function(r){return r.json();})
    .then(function(data){
      btn.disabled=false;btn.textContent='Fetch';
      if(data.error==='no_transcript'||!data.text){
        document.getElementById('yt-status').textContent='Pas de transcription auto. Colle-la manuellement :';
        document.getElementById('yt-paste-area').style.display='block';
        return;
      }
      ytTranscript=data.text;
      ytShowTranscript(data.text);
    })
    .catch(function(){
      btn.disabled=false;btn.textContent='Fetch';
      document.getElementById('yt-status').textContent='Erreur réseau. Colle la transcription manuellement :';
      document.getElementById('yt-paste-area').style.display='block';
    });
}

function ytUsePaste(){
  var t=document.getElementById('yt-paste').value.trim();
  if(!t) return;
  ytTranscript=t;
  document.getElementById('yt-paste-area').style.display='none';
  ytShowTranscript(t);
}

function ytShowTranscript(text){
  document.getElementById('yt-status').textContent='✓ Transcription prête ('+text.split(' ').length+' mots)';
  document.getElementById('yt-transcript-text').textContent=text;
  document.getElementById('yt-transcript-box').style.display='block';
  document.getElementById('yt-analyze-btn').style.display='block';
  ytChatHistory=[];
  document.getElementById('yt-messages').innerHTML='';
  document.getElementById('yt-ideas').style.display='none';
  document.getElementById('yt-ideas').innerHTML='';
  document.getElementById('yt-chat-wrap').style.display='none';
  document.getElementById('yt-save-btn').style.display='none';
}

function ytToggleTranscript(){
  var el=document.getElementById('yt-transcript-text');
  var icon=document.getElementById('yt-toggle-icon');
  var open=el.style.display==='block';
  el.style.display=open?'none':'block';
  icon.textContent=open?'▼':'▲';
}

function ytAnalyze(){
  var btn=document.getElementById('yt-analyze-btn');
  btn.disabled=true;btn.textContent='⏳ Analyse en cours...';
  var ideasEl=document.getElementById('yt-ideas');
  ideasEl.style.display='block';
  ideasEl.innerHTML='<div style="font-size:10px;font-family:Space Mono,monospace;color:var(--muted);padding:12px 0">Analyse IA en cours...</div>';

  var prompt='Tu es un assistant d\'analyse de vidéo. Voici la transcription d\'une vidéo YouTube :\n\n'+ytTranscript.slice(0,8000)+'\n\nAnalyse ce contenu et retourne un JSON UNIQUEMENT (sans markdown, sans backticks) avec cette structure exacte :\n{"themes":[{"titre":"...","description":"...","couleur":"#hexcolor"}],"insights":[{"texte":"..."}],"citations":[{"texte":"..."}],"questions":[{"texte":"..."}]}\n\nThèmes : 3-5 grands thèmes abordés. Insights : 4-6 idées clés retenues. Citations : 2-3 phrases marquantes. Questions : 3-4 questions que soulève cette vidéo. Réponds uniquement avec le JSON.';

  fetch('/claude',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:1500,
      messages:[{role:'user',content:prompt}]
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    btn.disabled=false;btn.textContent='⚡ Analyser avec l\'IA';
    var raw=data.content&&data.content[0]&&data.content[0].text||'{}';
    var clean=raw.replace(/```json|```/g,'').trim();
    try{
      var parsed=JSON.parse(clean);
      ytRenderIdeas(parsed);
      ytChatHistory=[{role:'user',content:'Voici la transcription : '+ytTranscript.slice(0,6000)},{role:'assistant',content:'J\'ai analysé cette vidéo. Je suis prêt à répondre à tes questions.'}];
      document.getElementById('yt-chat-wrap').style.display='block';
      document.getElementById('yt-save-btn').style.display='block';
    }catch(e){
      ideasEl.innerHTML='<div style="font-size:11px;color:var(--muted);font-family:Space Mono,monospace">'+esc(raw)+'</div>';
    }
  })
  .catch(function(err){
    btn.disabled=false;btn.textContent='⚡ Analyser avec l\'IA';
    ideasEl.innerHTML='<div style="font-size:10px;color:#e02020;font-family:Space Mono,monospace">Erreur : '+esc(err.message)+'</div>';
  });
}

function ytRenderIdeas(data){
  var el=document.getElementById('yt-ideas');el.innerHTML='';
  var colors={'themes':'#ff4444','insights':'#f59e0b','citations':'#a855f7','questions':'#3b82f6'};
  var labels={'themes':'Thème','insights':'Insight','citations':'Citation','questions':'Question'};

  function section(key,items){
    if(!items||!items.length) return;
    var label=document.createElement('div');label.className='yt-section-label';label.textContent=labels[key]+'s';el.appendChild(label);
    items.forEach(function(item){
      var card=document.createElement('div');card.className='yt-idea-card';
      var color=colors[key]||'#ff4444';
      var tagHtml='<span class="yt-idea-tag" style="background:'+color+'18;color:'+color+';border:0.5px solid '+color+'40">'+labels[key].toUpperCase()+'</span>';
      var titleHtml=item.titre?'<div class="yt-idea-title">'+esc(item.titre)+'</div>':'';
      var bodyText=item.description||item.texte||'';
      var bodyHtml=bodyText?'<div class="yt-idea-body">'+esc(bodyText)+'</div>':'';
      card.innerHTML=tagHtml+titleHtml+bodyHtml;
      el.appendChild(card);
    });
  }

  section('themes',data.themes);
  section('insights',data.insights);
  section('citations',data.citations);
  section('questions',data.questions);
}

function ytSend(){
  var input=document.getElementById('yt-chat-input');
  var msg=input.value.trim();if(!msg) return;
  input.value='';
  var msgs=document.getElementById('yt-messages');
  var sendBtn=document.getElementById('yt-send-btn');
  sendBtn.disabled=true;

  var userDiv=document.createElement('div');userDiv.className='yt-msg user';userDiv.textContent=msg;msgs.appendChild(userDiv);
  var aiDiv=document.createElement('div');aiDiv.className='yt-msg ai loading';aiDiv.textContent='...';msgs.appendChild(aiDiv);
  msgs.scrollTop=msgs.scrollHeight;

  ytChatHistory.push({role:'user',content:msg});

  fetch('/claude',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:1000,
      system:'Tu es un assistant qui aide à analyser et comprendre le contenu d\'une vidéo YouTube. Sois concis, précis et pertinent. Réponds en français.',
      messages:ytChatHistory
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    sendBtn.disabled=false;
    var reply=data.content&&data.content[0]&&data.content[0].text||'Pas de réponse.';
    aiDiv.className='yt-msg ai';aiDiv.textContent=reply;
    ytChatHistory.push({role:'assistant',content:reply});
    msgs.scrollTop=msgs.scrollHeight;
  })
  .catch(function(err){
    sendBtn.disabled=false;
    aiDiv.className='yt-msg ai';aiDiv.textContent='Erreur : '+err.message;
    msgs.scrollTop=msgs.scrollHeight;
  });
}

function ytSave(){
  if(!ytTranscript) return;
  var content='=== YOUTUBE LAB ===\n\nTranscription :\n'+ytTranscript.slice(0,3000);
  var xhr=new XMLHttpRequest();
  xhr.open('POST',GAS,true);
  xhr.setRequestHeader('Content-Type','text/plain;charset=utf-8');
  var btn=document.getElementById('yt-save-btn');
  btn.textContent='Sauvegarde...';
  xhr.onload=function(){btn.textContent='✓ Sauvegardé';setTimeout(function(){btn.textContent='💾 Sauvegarder dans Google Docs';},2000);};
  xhr.onerror=function(){btn.textContent='✓ Sauvegardé';};
  xhr.send(JSON.stringify({docId:'1p2TtShpX6ra94637lwGiZ0QrjtzT7Ttn',content:content,title:'YouTube — '+new Date().toLocaleDateString('fr-FR')}));
}

        document.getElementById('loading').classList.add('out');
        setTimeout(function(){document.getElementById('loading').style.display='none';},700);
      });

    Object.keys(searchCache).length&&sections.forEach(function(){});
  }, 5*60*1000);
});
